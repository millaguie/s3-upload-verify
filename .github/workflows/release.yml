name: release

# Push a tag like v1.0.0 to build the programs and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "moto[server]" boto3
      - run: python -m pytest -q -p no:logging

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: s3-upload-verify-windows.exe
          - os: macos-latest
            asset: s3-upload-verify-macos-arm64.zip
          # Older glibc, so the binary also starts on Ubuntu 22.04, Debian 12 and RHEL 9.
          - os: ubuntu-22.04
            asset: s3-upload-verify-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # certifi: the bundled OpenSSL can't find the system CA certificates on macOS and some Linux.
      - run: python -m pip install pyinstaller==6.11.1 certifi
      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name s3-upload-verify s3_upload_verify.py
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/s3-upload-verify.exe "${{ matrix.asset }}"; else mv dist/s3-upload-verify "${{ matrix.asset }}"; fi
      - name: Build (macOS app)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name "S3 Upload Verify" s3_upload_verify.py
          ditto -c -k --keepParent "dist/S3 Upload Verify.app" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* s3_upload_verify.py --title "$GITHUB_REF_NAME" --generate-notes
